  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --ink: #000;
      --ink-soft: #333;
      --bg: #fff;
      --line: #e3e3e3;
      --pad-inline: clamp(20px, 6vw, 96px);
      --pad-block: clamp(28px, 7vh, 80px);
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      margin: 0;
    }

    #root {
      align-items: center;
      display: flex;
      min-height: 100vh;
      min-height: 100dvh;
      padding: var(--pad-block) var(--pad-inline);
    }

    @media (max-width: 899px) and (min-height: 700px) {
      #root { align-items: flex-start; padding-block-start: clamp(28px, 22vh, 200px); }
    }

    .page {
      display: flex;
      flex-direction: column;
      gap: clamp(24px, 5vw, 72px);
      margin-inline: auto;
      max-width: 1440px;
      min-width: 0;
      width: 100%;
    }

    @media (min-width: 900px) {
      .page { align-items: center; flex-direction: row; }
    }

    .content { flex: 1 1 auto; min-width: 0; }

    .eyebrow {
      font-size: clamp(0.75rem, 1.5vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      margin: 0;
    }

    .subject {
      align-items: center;
      display: flex;
      font-size: clamp(1.75rem, 7vw, 4.5rem);
      gap: 0.22em;
      margin: clamp(14px, 2.6vh, 30px) 0;
      min-width: 0;
    }

    .subject.wrapped { align-items: flex-start; }

    .favicon {
      border-radius: 0.12em;
      flex: none;
      height: 0.78em;
      max-height: 48px;
      max-width: 48px;
      min-height: 18px;
      min-width: 18px;
      object-fit: contain;
      width: 0.78em;
    }

    .subject.wrapped .favicon { margin-top: 0.12em; }

    .domain {
      flex: 1 1 0%;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      min-width: 0;
      white-space: nowrap;
    }

    .domain.wrap { overflow-wrap: anywhere; white-space: normal; }

    .code {
      font-size: clamp(4.5rem, 40vw, 16rem);
      font-weight: 400;
      letter-spacing: -0.06em;
      line-height: 0.85;
      margin: clamp(8px, 1.5vh, 20px) 0 clamp(16px, 3vh, 36px) -0.04em;
    }

    .code.wide { font-size: clamp(3.5rem, 30vw, 12rem); }

    .desc {
      color: var(--ink-soft);
      font-size: clamp(1rem, 2vw, 1.5rem);
      line-height: 1.4;
      margin: 0;
      max-width: 34ch;
      text-wrap: pretty;
    }

    .widget { margin-top: clamp(20px, 3.5vh, 40px); min-height: 65px; min-width: min(300px, 100%); }

    .cfErrorBox {
      color: var(--ink-soft);
      font-size: clamp(0.8rem, 1.3vw, 0.95rem);
      line-height: 1.5;
      margin-top: clamp(18px, 3vh, 36px);
      max-width: 60ch;
      opacity: 0;
      overflow-wrap: anywhere;
      transition: opacity 0.15s ease-in;
      user-select: none;
    }

    .cfErrorBox.revealed { opacity: 1; user-select: text; }

    @media (prefers-reduced-motion: reduce) {
      .cfErrorBox { transition: none; }
    }

    .spinner {
      animation: spin 0.8s linear infinite;
      border: 2px solid var(--line);
      border-radius: 50%;
      border-top-color: var(--ink);
      height: 22px;
      margin: clamp(16px, 3vh, 32px) 0 0;
      width: 22px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2.4s; }
    }

    .art { margin-inline: auto; max-width: 300px; width: 100%; }
    .art svg { display: block; height: auto; width: 100%; }

    @media (min-width: 900px) {
      .art { flex: 0 1 38%; margin-inline: 0; max-width: 440px; }
    }

    @media (max-height: 560px) and (max-width: 899px) {
      .art { display: none; }
    }

  </style>
