# Cloudflare Pages: a medicalpiercing.hu klonja. A projekt gyokere a tarhazban:
# medicalpiercing/ (Root directory), build-parancs: node tools/build.mjs, kimenet: dist.
# A lapcimeket es az urlapokat a functions/[[path]].js kezeli.
name = "medicalpiercing"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Nem titkos beallitasok (mindket kornyezet). A titkos SMTP_PASS (Gmail-
# alkalmazasjelszo) a Cloudflare feluleten, Secret tipussal kerul be.
[vars]
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "465"
SMTP_USER = "medicalpiercing.hu@gmail.com"
MAIL_TO = "medicalpiercing.hu@gmail.com"

# Foglalas-meres (docs/MERES_GOOGLE_ARNYEK.md): sajat D1, a Mosaic adatbazisaitol kulon. A fiok D1-kerete (10)
# betelt, ezert az elonezet ugyanezt az adatbazist hasznalja: a sorok "kornyezet" oszlopa (eles / elonezet)
# valasztja szet (ugyanaz a kotes mindket kornyezetben, [env.preview] blokk nelkul), es elonezetrol a kod soha nem tolt fel elesben (csak validate_only / dryrun).
[[d1_databases]]
binding = "MP_MERES_DB"
database_name = "mp-meres"
database_id = "68a1b80e-ab8e-48ac-9ef7-5fc02c07326e"

