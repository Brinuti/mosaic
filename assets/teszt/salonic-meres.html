<!doctype html><meta charset="utf-8"><title>m</title>
<style>body{margin:0;font:12px Arial;display:flex;gap:40px;padding:10px}.k{position:relative;padding-left:44px}.v{position:absolute;left:0;top:0;width:40px;height:1100px;background:repeating-linear-gradient(#000 0 1px,transparent 1px 10px)}
.v span{position:absolute;left:0;font:bold 11px Arial;background:#ff0;color:#000}iframe{border:2px solid red;height:1100px;display:block}</style>
<div class="k"><div class="v" id="v1"></div><iframe id="a" style="width:290px"></iframe></div>
<div class="k"><div class="v" id="v2"></div><iframe id="b" style="width:358px"></iframe></div>
<p id="s">...</p>
<script>
for (const v of [v1, v2]) for (let y = 0; y <= 1100; y += 50) { const s = document.createElement('span'); s.style.top = y + 'px'; s.textContent = y; v.append(s); }
(async () => {
  const t = Math.floor(Date.now() / 1000);
  const q = new URLSearchParams({ startDate: t, offset: 0, days: 30, placeId: 14585, serviceId: 471152, employeeId: -1, calendarId: '76a8541e-bb52-22ab-f8c0-531b86f55abb', pref: '', apiVersion: 1, language: 'hu', excludeNonAcceptingEmployees: 0 });
  const j = await (await fetch('https://api.salonic.hu/calendar/getAvailableTimes?' + q)).json();
  const ts = (JSON.stringify(j).match(/"timestamp":\s*(\d+)/g) || []).map((x) => +x.replace(/\D/g, '')).filter((x) => x > t + 86400).sort();
  const u = 'https://mosaic-pmu.salonic.hu/guestData/?' + new URLSearchParams({ placeId: 14585, serviceId: 471152, employeeId: -1, startDate: ts[0] });
  a.src = u; b.src = u; s.textContent = 'OK ' + ts.length + ' ' + u;
})().catch((e) => { s.textContent = 'HIBA ' + e; });
</script>
