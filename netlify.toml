# A klon publikalasa. A dist/ mappat a tools/netlify-build.mjs rakja ossze
# (klon/ + assets/ egy helyre). Eles publikalaskor a Netlify feluleten az
# ELES=1 kornyezeti valtozot kell beallitani - addig az oldal noindex.
[build]
  command = "node tools/netlify-build.mjs"
  publish = "dist"
  # A Netlify 2026-10-08 ota NEM epit: az oldalt a Cloudflare Pages publikalja (a PR-ok
  # elonezete is ott van), a Netlify minden buildje (az elonezetek is) kreditbe kerulne.
  # Ujra bekapcsolas: az alabbi sor torlese / a kovetkezore csereje:
  #   ignore = "node tools/netlify-kihagy.mjs"
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "20"
