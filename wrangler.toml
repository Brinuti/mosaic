# Cloudflare Pages-beallitas (a Netlify helyett / mellett). A dist/ mappat a
# tools/netlify-build.mjs rakja ossze, a lapcimeket es az urlapokat a
# functions/[[path]].js kezeli. A titkos beallitasok (SMTP_PASS stb.) a
# Cloudflare feluleten vannak, nem itt. A nem titkos valtozok IDE kellenek: ha van
# wrangler.toml, a Cloudflare a feluleten megadott nem titkos valtozokat torli.
name = "mosaicheadspa"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# A foglalasi "jegyzettomb" (Cloudflare KV, lasd docs/booking-engine/DECISIONS.md): a valodi foglalasi esemenyek az "Elo foglaltsag" savhoz.
# Eles es elonezeti nevter kulon. Az eles iras kapcsolo: ESEMENY_IRAS = "1" a [vars]-ban (a tulajdonos jovahagyasa utan; alapbol nincs).
[[kv_namespaces]]
binding = "ESEMENYEK"
id = "4af9393f77f04123a9be887170a5d743"   # mosaic-foglalas-esemenyek

[[env.preview.kv_namespaces]]
binding = "ESEMENYEK"
id = "b6a9eb3cb1c247a4be70787712fe1074"   # mosaic-foglalas-esemenyek-elonezet

# A nevtelen foglalo-lepes szamlalo (Cloudflare D1, DECISION-LOG #88, lasd docs/booking-engine/LEPES_MERES.md): csak osszesitett napi darabszamok, suti / azonosito / szemelyes adat nelkul.
# Eles es elonezeti adatbazis kulon. Az olvasas kulcsos (/api/foglalo-szamlalo?kulcs=...): ide a kulcs SHA-256-ja kerul, maga a kulcs nincs a kodban.
[[d1_databases]]
binding = "SZAMLALO_DB"
database_name = "mosaic-foglalo-szamlalo"
database_id = "2b6701fb-4b23-4e46-9b09-d5ba5eb8ba4e"

[[env.preview.d1_databases]]
binding = "SZAMLALO_DB"
database_name = "mosaic-foglalo-szamlalo-elonezet"
database_id = "08eb6f2f-180a-4352-a7f9-27333d5d6b5d"

# Foglalas -> megjelenes (booking-to-show) emlekezteto-rendszer (Cloudflare D1; docs/lifecycle/LIFECYCLE.md): foglalasok + kuldesi sor. Szemelyes adat (nev, telefon, e-mail) a kuldeshez;
# az idopont utan 60 nappal a napi karbantartas torli. Eles es elonezeti adatbazis kulon.
[[d1_databases]]
binding = "LIFECYCLE_DB"
database_name = "mosaic-lifecycle"
database_id = "9732506b-1f3c-4378-85dc-aa3c70a25817"

[[env.preview.d1_databases]]
binding = "LIFECYCLE_DB"
database_name = "mosaic-lifecycle-elonezet"
database_id = "bd58da1d-a9f0-4b76-ad0b-13aedfc67192"

[vars]
LIFECYCLE_MOD = "elo"   # ELES (a tulajdonos kifejezett kerese, 2026-10-08). ki | teszt (CSAK a teszt-vendegeknek megy uzenet) | elo (az LIFECYCLE_UZLETAGOK uzletagainak vendegeinek is)
LIFECYCLE_UZLETAGOK = "headspa,hair,oxygen,laser,pmu"
LIFECYCLE_MUNKATARS_MOD = "figyel"   # DECISION #117: munkatarsi torles / modositas: figyel = csak naplo + riasztas (nincs allapotvaltas); be = a docs/lifecycle/LIFECYCLE.md szerinti valtoztatas (a kontrollalt teszt utan)
LIFECYCLE_KULCS_HASH = "f750951108213168b1cf70520e779c0c4b07b6c3cc05af8258942c4b04443a7e"   # a bejovo / tick vegpontok kulcsanak SHA-256-ja; a kulcs a Zapier Storage-ban van (lifecycle_kulcs), a Zapier-lancok onnan olvassak (kulcscsere kesz: 2026-10-09)
SIMPLESMS_FELHASZNALO = "ferraj@gmail.com"
SIMPLESMS_DOMAIN = "mosaicheadspa.hu"   # a jelszo: SIMPLESMS_JELSZO (Secret, Production + Preview)
ESEMENY_IRAS = "1"   # a foglalasi jegyzettomb eles irasa BEKAPCSOLVA (a tulajdonos jovahagyta, 2026-10-04); kikapcsolas: a sor torlese
ESEMENY_KIHAGY = "2038420,3385039,3385031,3353226"   # a tulajdonos proba-vendegkartyai (a Salonic g: azonositoi): HeadSpa 2038420, Hair 3385039, Oxigen 3385031, Elysion 3353226; az ilyen foglalas nem kerul a jegyzettombbe
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "465"
SMTP_USER = "mosaicheadspa@gmail.com"
SZAMLALO_OLVASO_HASH = "d7122e43eeeca61db826d113cb06aa5028568fb63e57a00835978833b0a9b6a0"   # a foglalo-szamlalo olvaso kulcsanak SHA-256-ja (a kulcsot a tulajdonos kapta meg)
# Gift Commerce Engine (/ajandek, lasd AJANDEK.md): a nem titkos valtozok IDE kellenek (a feluleten megadottakat a
# wrangler.toml torli). Titkosak (Secret tipussal a feluleten): STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, AJANDEK_TITOK.
STRIPE_PUBLISHABLE_KEY = "pk_live_51QhTxoFv8vc2ArnLJDN8P0UApI3h2BtAA5U4Yj2SlJYZQihjqw6Sz65iWAaRB8xtQSfCnDLn067Zij1CPz3NJKyT007JIHo3hu"   # NYILVANOS kulcs (a tulajdonos adta, 2026-10-04); a titkos kulcs (STRIPE_SECRET_KEY, korlatozott rk_live) es a STRIPE_WEBHOOK_SECRET a Cloudflare Production Secret-jei
# AJANDEK_BAZIS_URL = "https://www.mosaicheadspa.hu"
AJANDEK_STRIPE_SZAMLA = "1"   # Stripe-szamla (tetelek + Stripe Tax; a szamlabridge ezt olvassa elsokent, lasd AJANDEK.md 17. kor): "1" = minden fizetes (igazolva 2026-10-04: elo, fizetes nelkuli proba, a szamlabridge elonezete a helyes tetelekkel); "teszt" = csak a +szamlateszt cimkezesu e-mailek; ures = ki. Hiba eseten sima PaymentIntent + kezi szamla jelzes.
# Lezeres szortelenites ajandekkartya (/lezeres-ajandekkartya, /api/ajandek-lezer/*): a lezeres Stripe-fiok NYILVANOS kulcsa (pk_live_...). A titkok (Secret tipussal a feluleten):
# LEZER_STRIPE_SECRET_KEY (rk_live_...), LEZER_STRIPE_WEBHOOK_SECRET (whsec_...), LEZER_SZAMLAZZ_AGENT_KULCS. Lasd AJANDEK.md "Lezeres ajandekkartya".
