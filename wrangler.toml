# Cloudflare Pages-beallitas (a Netlify helyett / mellett). A dist/ mappat a
# tools/netlify-build.mjs rakja ossze, a lapcimeket es az urlapokat a
# functions/[[path]].js kezeli. A titkos beallitasok (SMTP_PASS stb.) a
# Cloudflare feluleten vannak, nem itt. A nem titkos valtozok IDE kellenek: ha van
# wrangler.toml, a Cloudflare a feluleten megadott nem titkos valtozokat torli.
name = "mosaicheadspa"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# A foglalasi "jegyzettomb" (Cloudflare KV, lasd docs/booking-engine/DECISIONS.md): a valodi foglalasi esemenyek az "Elo foglaltsag" savhoz.
# Eles es elonezeti nevter kulon. Az eles iras kapcsolo: ESEMENY_IRAS = "1" a [vars]-ban (a tulajdonos jovahagyasa utan; alapbol nincs).
[[kv_namespaces]]
binding = "ESEMENYEK"
id = "4af9393f77f04123a9be887170a5d743"   # mosaic-foglalas-esemenyek

[[env.preview.kv_namespaces]]
binding = "ESEMENYEK"
id = "b6a9eb3cb1c247a4be70787712fe1074"   # mosaic-foglalas-esemenyek-elonezet

# A nevtelen foglalo-lepes szamlalo (Cloudflare D1, DECISION-LOG #88, lasd docs/booking-engine/LEPES_MERES.md): csak osszesitett napi darabszamok, suti / azonosito / szemelyes adat nelkul.
# Eles es elonezeti adatbazis kulon. Az olvasas kulcsos (/api/foglalo-szamlalo?kulcs=...): ide a kulcs SHA-256-ja kerul, maga a kulcs nincs a kodban.
[[d1_databases]]
binding = "SZAMLALO_DB"
database_name = "mosaic-foglalo-szamlalo"
database_id = "2b6701fb-4b23-4e46-9b09-d5ba5eb8ba4e"

[[env.preview.d1_databases]]
binding = "SZAMLALO_DB"
database_name = "mosaic-foglalo-szamlalo-elonezet"
database_id = "08eb6f2f-180a-4352-a7f9-27333d5d6b5d"

# A foglalas-kulcs tabla (Cloudflare D1, QA-1 folytatas, lasd docs/booking-engine/BOOKING_ID.md): a foglalo sajat booking_id-je <-> a Salonic-foglalas parositasa.
# Szemelyes adat nincs benne. CSAK ELONEZETKENT kotve (a PR-elonezet kulon adatbazist hasznal); az eles kotes (database_name = "mosaic-foglalas-kulcs", [[d1_databases]] binding = "KULCS_DB")
# az elesites donteseig hianyzik: az eles /api/foglalas-kulcs 503-at ad, a koszonooldali iro ezt elnyeli (a foglalas ettol nem akad el).
[[env.preview.d1_databases]]
binding = "KULCS_DB"
database_name = "mosaic-foglalas-kulcs-elonezet"
database_id = "628113fe-9793-450d-baad-fc77814995eb"

[vars]
ESEMENY_IRAS = "1"   # a foglalasi jegyzettomb eles irasa BEKAPCSOLVA (a tulajdonos jovahagyta, 2026-10-04); kikapcsolas: a sor torlese
ESEMENY_KIHAGY = "2038420,3385039,3385031,3353226"   # a tulajdonos proba-vendegkartyai (a Salonic g: azonositoi): HeadSpa 2038420, Hair 3385039, Oxigen 3385031, Elysion 3353226; az ilyen foglalas nem kerul a jegyzettombbe
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "465"
SMTP_USER = "mosaicheadspa@gmail.com"
SZAMLALO_OLVASO_HASH = "d7122e43eeeca61db826d113cb06aa5028568fb63e57a00835978833b0a9b6a0"   # a foglalo-szamlalo olvaso kulcsanak SHA-256-ja (a kulcsot a tulajdonos kapta meg)
# Gift Commerce Engine (/ajandek, lasd AJANDEK.md): a nem titkos valtozok IDE kellenek (a feluleten megadottakat a
# wrangler.toml torli). Titkosak (Secret tipussal a feluleten): STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, AJANDEK_TITOK.
STRIPE_PUBLISHABLE_KEY = "pk_live_51QhTxoFv8vc2ArnLJDN8P0UApI3h2BtAA5U4Yj2SlJYZQihjqw6Sz65iWAaRB8xtQSfCnDLn067Zij1CPz3NJKyT007JIHo3hu"   # NYILVANOS kulcs (a tulajdonos adta, 2026-10-04); a titkos kulcs (STRIPE_SECRET_KEY, korlatozott rk_live) es a STRIPE_WEBHOOK_SECRET a Cloudflare Production Secret-jei
# AJANDEK_BAZIS_URL = "https://www.mosaicheadspa.hu"
AJANDEK_STRIPE_SZAMLA = "1"   # Stripe-szamla (tetelek + Stripe Tax; a szamlabridge ezt olvassa elsokent, lasd AJANDEK.md 17. kor): "1" = minden fizetes (igazolva 2026-10-04: elo, fizetes nelkuli proba, a szamlabridge elonezete a helyes tetelekkel); "teszt" = csak a +szamlateszt cimkezesu e-mailek; ures = ki. Hiba eseten sima PaymentIntent + kezi szamla jelzes.
AJANDEK_AZONNALI = "1"   # a tulajdonos donotese (2026-10-04): bankkartyas rendelesnel a kartya a fizetes utan AZONNAL kimegy; a szalon a levelben kapott kodot viszi fel a Salonicba. Atutalasnal marad a kezi gomb.

# PR-elonezetek (preview deployok): a "vars" nem orokodik, ezert az SMTP-ertekek itt ujra szerepelnek. A Stripe
# TESZT-modu NYILVANOS kulcsa (pk_test_...) publikus, minden fizetooldal HTML-jeben benne van. Az eles ([vars]) nem erintett.
# A titkok (STRIPE_SECRET_KEY = sk_test_..., STRIPE_WEBHOOK_SECRET, AJANDEK_TITOK, MAIL_TO, SMTP_PASS) a Cloudflare feluleten,
# a Preview kornyezetben, Secret tipussal vannak.
[env.preview.vars]
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "465"
SMTP_USER = "mosaicheadspa@gmail.com"
SZAMLALO_OLVASO_HASH = "d7122e43eeeca61db826d113cb06aa5028568fb63e57a00835978833b0a9b6a0"
EGYEZTETES_KULCS_HASH = "04fbe0cc4e571ff62ee6d760b1bb1ce694cbf726930a95f4a669c7dbaa372b60"   # a foglalas-kulcs / parositas vegpontok kulcsanak SHA-256-ja (CSAK elonezet; a kulcs maga nincs a kodban)
STRIPE_PUBLISHABLE_KEY = "pk_test_51QhTxoFv8vc2ArnLyqmRz5giwCnlNAtTTygecEAnBRWbFmYrPWTYQtsCG3tSVI6hU3BJCBBKBNaMe6621Twfq40r00wzanIqTE"
AJANDEK_AZONNALI = "1"
AJANDEK_STRIPE_SZAMLA = "1"
AJANDEK_SZAMLA_ADO_ELLENORZES = "0"   # CSAK elonezet: a Stripe teszt-modnak nincs adoregisztracioja (0 ado), igy az ado-ellenorzes kikapcsolva; az eles mindig ellenoriz
# QA-2 ARNYEK-MERES (DECISION-LOG #99; lasd docs/booking-engine/QA2_ARNYEK.md): CSAK ELONEZET. Az eles ([vars]) NEM kapja meg: ott az elosztas ki van kapcsolva (MERES_ELOSZTO hianyzik).
# A kuldes kizarolag az ARNYEK-celpontokra mehet (kodban rogzitve: netlify/lib/meres/platformok.js), tesztkoddal. A nem titkos ertekek ITT vannak; a titkok a Cloudflare feluleten / API-n,
# Preview / Secret tipussal: META_CAPI_TOKEN, TIKTOK_EVENTS_TOKEN, GA4_TESZT_API_SECRET (beallitva 2026-10-06), GOOGLE_ARNYEK_WEBHOOK_URL (a Zapier-webhook; a Zap-et a meresi munkamenet epiti).
# Titok nelkul a kerelem elkeszul es naplozodik ("nincs_hitelesites"), kuldes nem tortenik.
MERES_ELOSZTO = "1"
META_TESZT_KOD = "TEST83939"            # a Meta Esemenykezelo "Teszteszemenyek" kodja (dataset 28616665324611098, MOSAIC ARNYEK meres-teszt)
TIKTOK_TESZT_KOD = "TEST_MOSAIC_QA2"    # SZINTETIKUS: a TikTok Esemenykezelo teszteszemeny-kodjara cserelendo (valtozo-csere, kodvaltoztatas nelkul)
GA4_TESZT_MEASUREMENT_ID = "G-M5MLRLNQBP"   # a GA4 TESZT-property (az elo G-H4206SQ0Q7 a kodban tiltott); a Measurement Protocol secret: GA4_TESZT_API_SECRET (titok)
MERES_NAPLO_TELJES = "1"                # CSAK elonezet (sajat teszt-IP): a naploban a TELJES kikuldott payload; ott, ahol nincs beallitva, a nyers IP maszkolt

# A szemelyre szabott ajandekkartyak fotoi (Cloudflare KV, lasd AJANDEK.md "Foto-tarolas"): eles es elonezeti nevter kulon.
# A kezelo az AJANDEK_FOTOK kotesen at olvassa / irja; nelkule a fotofeltoltes ki van kapcsolva.
[[kv_namespaces]]
binding = "AJANDEK_FOTOK"
id = "2e712cfb6c2f43918468a79dd3773f0f"   # mosaic-ajandek-fotok

[[env.preview.kv_namespaces]]
binding = "AJANDEK_FOTOK"
id = "69e750b6c0664b08a71a72dfbc96ae62"   # mosaic-ajandek-fotok-elonezet
