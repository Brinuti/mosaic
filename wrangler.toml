database_name = "mosaic-riport"
database_id = "ebfc9cf5-50ad-4085-852c-f1742e023d58"

[[env.preview.d1_databases]]
binding = "HOS_DB"
database_name = "mosaic-riport"
database_id = "ebfc9cf5-50ad-4085-852c-f1742e023d58"

