# Oxigenterapia ajandekkartya (/oxigen-ajandekkartya, /api/ajandek-oxigen/*): az oxigenes Stripe-fiok (Mosaic Oxigen Terapia, Bozsoki - Harangozo Tunde e.v.) NYILVANOS kulcsa (pk_live_...).
# A titkok (Secret tipussal a feluleten): OXIGEN_STRIPE_SECRET_KEY (rk_live_...), OXIGEN_STRIPE_WEBHOOK_SECRET (whsec_...), OXIGEN_SZAMLAZZ_AGENT_KULCS. Lasd AJANDEK.md "Oxigenterapia ajandekkartya".
