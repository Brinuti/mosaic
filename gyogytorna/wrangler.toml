# Cloudflare Pages: a gyogytornaszom.hu foglalomotorja. A projekt neve: gyogytorna; gyoker (Root directory) a tarhazban: gyogytorna/;
# build-parancs: node tools/build.mjs, kimenet: dist. A vegpontok: functions/api/*. Eles hasznalat: a www.gyogytornaszom.hu/gy-foglalas/*
# utvonalat egy kis proxy Worker a Pages-eredetre kuldi (elso feles sutik); az elonezet a Pages sajat cime.
name = "gyogytorna"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GY_ATTR_NELKUL = "1"        # hozzajarulas nelkuli (24 oras) munkamenet-forras; vesz-kikapcsolas: "0" (Feri dontese, 2026-10-13)
GY_ORIGINS = "https://www.gyogytornaszom.hu,https://gyogytornaszom.hu"

# A titkok a Cloudflare felueleten, Secret tipussal, kornyezetenkent: GY_HMAC_KULCS (tranzakcio_id es parosito), GY_ADMIN_KULCS_HASH (a /api/gy-admin es
# /api/gy-kampanyok kulcsanak SHA-256 hash-e).
# D1: a fiok D1-kerete (10) betelt, ezert a Medical Piercing "mp-meres" adatbazisat hasznaljuk KULON, gy_ elotagu tablakkal (gy_foglalas, gy_munkamenet,
# gy_token, gy_kampany, gy_meta, gy_riasztas); a motor nem ir mas tablaba. Az eles es az elonezet ugyanazt a kotest hasznalja.
[[d1_databases]]
binding = "GY_DB"
database_name = "mp-meres"
database_id = "68a1b80e-ab8e-48ac-9ef7-5fc02c07326e"
