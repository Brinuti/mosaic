    <script>
        var $target;
        var $serviceListContainer, $selectedServicesRoot;
        var $selectedServicesContainer, $selectedServicesCounter, $selectedServicesDuration,
            $selectedServicesPrice;
        var $servicesInput;
        var $btnNext;
        var t;

        var _renderInfo = function () {
            var selected = +services.length;
            if (selected > 0) {
                $selectedServicesRoot.addClass('active');
                $btnNext.removeAttr('disabled');

                if (selected === 1) {
                    $selectedServicesCounter.html(services[0].name);
                } else {
                    $selectedServicesCounter.html(services.length + ' Szolgáltatás');
                }

                //$selectedServicesContainer.find('.labels').addClass('heartBeat');
                /* setTimeout(function () {
                    $selectedServicesContainer.find('.labels').removeClass('heartBeat');
                }, 1000); */

                $selectedServicesDuration.html(arguments[0] + ' perc');
                if (arguments[1] > 0) {
                    $selectedServicesPrice.html(' - ' + format_huf(arguments[1], 'Ft'));
                }
            } else {
                $btnNext.attr('disabled', 'disabled');
                $selectedServicesRoot.removeClass('active');

                setTimeout(function () {
                    $selectedServicesCounter.empty();
                    $selectedServicesDuration.empty();
                    $selectedServicesPrice.empty();
                }, 100);
            }
        };

        var selectedEmployees = [];
        var services = [];

        var handleServiceSelect = function (e) {
            e.preventDefault();
            clearTimeout(t);

            
            var $t = $('input[type=checkbox]:checked', $serviceListContainer);
            if ($t.length) {
                $servicesInput.attr('disabled', 'disabled');
                var serviceId = $t.data('id');

                services.push({
                    id: serviceId,
                    name: $t.data('name'),
                    duration: $t.data('duration'),
                    price: $t.data('price')
                });

                _goToNextPage();
            }

                    };

        function _goToNextPage(e) {
            if (e) {
                e.preventDefault();
            }

            var selectedServices = [];
            var selectedServicesObj = [];

            for (var idx in services) {
                selectedServices[idx] = services[idx].id;
                selectedServicesObj[idx] = services[idx];
            }

            if (!selectedServices || selectedServices.length === 0) {
                return;
            }

            if (typeof dataLayer !== 'undefined') {
                dataLayer.push({ecommerce: null});

                var GAPayload = {
                    event: "view_item",
                    ecommerce: {
                        currency: "HUF",
                        value: 0,
                        items: []
                    }
                };

                for (var idx2 in selectedServicesObj) {
                    var tempObj = selectedServicesObj[idx2];

                    GAPayload.ecommerce.items.push({
                        item_name: tempObj.name,
                        price: tempObj.price,
                        currency: "Ft"
                    });

                    GAPayload.ecommerce.value += tempObj.price;

                    //dataLayer.push({event: "select_content", content_type: tempObj.name});
                }

                dataLayer.push(GAPayload);
            }

            $btnNext.attr('disabled', 'disabled');
            $btnNext.html('<i class="fas fa-spinner refresh-animate"></i>');

            var goToUrl = '/selectEmployee/?placeId=2581&serviceId=' + selectedServices.join(',');
            setTimeout(function () {
                window.location = goToUrl;
            }, 300);
        }

        var initServiceSelector = function () {
            $serviceListContainer = $("#selectService");
            $selectedServicesRoot = $("#selectedServicesContainer");
            $selectedServicesContainer = $(".container", $selectedServicesRoot);
            $selectedServicesCounter = $(".services-count-label", $selectedServicesContainer);
            $selectedServicesDuration = $(".duration", $selectedServicesContainer);
            $btnNext = $(".btn-next", $selectedServicesContainer);
            $selectedServicesPrice = $(".price", $selectedServicesContainer);
            $servicesInput = $('input[type=checkbox]', $serviceListContainer);

            $servicesInput.on('change', handleServiceSelect);


            
            $servicesInput.removeAttr('checked');

            
            $btnNext.on('click', _goToNextPage);
            setTimeout(function () {
                $servicesInput.removeAttr('checked');
            }, 50);
        };

        $(function () {
            $target = $("#searchService");
            $target.on('change', function () {
                var serviceId = $(this).val();
                $("#service_" + serviceId).trigger('click');
            });

            initServiceSelector();

                    });
    </script>

    <script type="text/javascript">

        function searchService(e) {
            var $target = $(this);
            var filter;
            var $items = $(".service-item-container");
            $items.removeClass('d-none');

            filter = $target.val().toUpperCase();

            if (filter) {
                $(".spec-title").removeClass('d-flex').addClass('d-none');
                $(".spec-desc").removeClass('d-flex').addClass('d-none');
            } else {
                $(".spec-title").addClass('d-flex').removeClass('d-none');
                $(".spec-desc").addClass('d-flex').removeClass('d-none');
            }

            $items.each(function () {
                var $obj = $(this);
                var title = '' + $obj.data('title');

                var resultFinal = title.toUpperCase().indexOf(filter) > -1;

                $obj.removeClass('d-none');
                $obj.removeClass('d-flex');
                if (resultFinal) {
                    $obj.addClass('d-flex');
                } else {
                    $obj.addClass('d-none');
                }
            });
        }

        $(function () {
            $("#search-input").on('keyup', searchService);
        });
    </script>
