<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MOSAIC – fotó és videó feltöltés</title>
<link rel="icon" href="/assets/img/c2eb0f_b001e2c55098446da3e38ff055e20354.png" type="image/png">
<!-- Belso oldal: a kollegak telefonrol toltenek fel fotot/videot a Mosaic Drive-jaba (mosaicheadspa Apps Script API). Nincs mero kod, nincs link ra, noindex. -->
<style>
  :root { --bg:#f6f3ef; --card:#fff; --ink:#2b2622; --mute:#6f665f; --acc:#8a6a4f; --acc2:#efe6dc; --ok:#2f7d4f; --err:#b3261e; --line:#e4ddd5; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:26px; margin:6px 0 20px; text-align:center; }
  h2 { font-size:19px; margin:0 0 10px; }
  .step { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:16px; }
  .folders { display:grid; gap:10px; }
  .folders button { padding:18px; font-size:20px; font-weight:700; border-radius:14px; border:2px solid var(--line); background:#fff; color:var(--ink); text-align:left; }
  .folders button.on { border-color:var(--acc); background:var(--acc2); }
  .folders button.on::after { content:" ✓"; color:var(--acc); }
  .pick { display:block; text-align:center; padding:34px 12px; border-radius:16px; background:var(--acc); color:#fff; font-size:22px; font-weight:700; cursor:pointer; }
  .pick input { display:none; }
  .file { border-top:1px solid var(--line); padding:14px 0 6px; }
  .file .meta { font-size:15px; color:var(--mute); margin-bottom:8px; word-break:break-all; }
  .nm { display:flex; gap:6px; align-items:center; }
  .nm input { flex:1; min-width:0; font-size:18px; padding:14px; border:1px solid var(--line); border-radius:12px; }
  .nm span { color:var(--mute); }
  .bar { height:12px; background:var(--line); border-radius:6px; overflow:hidden; margin-top:10px; }
  .bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .2s; }
  .st { font-size:16px; margin-top:6px; font-weight:600; } .ok { color:var(--ok); } .err { color:var(--err); }
  #go { width:100%; padding:22px; font-size:22px; font-weight:700; border:0; border-radius:16px; background:var(--ok); color:#fff; }
  #go:disabled { opacity:.35; }
  #msg { font-size:18px; font-weight:600; text-align:center; margin-top:14px; }
  .hint { color:var(--mute); font-size:15px; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>📷 Mosaic feltöltés</h1>

  <section class="step">
    <h2>1. Melyik mappába?</h2>
    <div class="folders" id="folders">Betöltés…</div>
  </section>

  <section class="step">
    <h2>2. Fotó vagy videó</h2>
    <label class="pick">+ Kiválasztás
      <input id="files" type="file" accept="image/*,video/*" multiple>
    </label>
    <div class="hint">A név átírható, ha szeretnéd.</div>
    <div id="list"></div>
  </section>

  <button id="go" disabled>3. Feltöltés</button>
  <div id="msg"></div>
</main>

<script>
var CHUNK = 8 * 1024 * 1024; // 8 MB, a 256 KB többszöröse
var folder = '', items = [], busy = false;
var $ = function (id) { return document.getElementById(id); };

var API = 'https://script.google.com/macros/s/AKfycbyrKy330YbhzafbMPR1PL260lYvqBQZ7Q2Uzx3-z0tZdUAYqAepDY8tjfxFFYxNaywArQ/exec';
async function api(body) {
  var r = await fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('Kapcsolati hiba (' + r.status + ').');
  var j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Ismeretlen hiba.');
  return j.data;
}
function call(fn) {
  var a = Array.prototype.slice.call(arguments, 1);
  if (fn === 'getFolders') return api({ a: 'folders' });
  if (fn === 'initUpload') return api({ a: 'init', folder: a[0], name: a[1], ext: a[2], type: a[3], size: a[4], who: a[5] });
  if (fn === 'uploadChunk') return api({ a: 'chunk', session: a[0], b64: a[1], start: a[2], total: a[3] });
  return Promise.reject(new Error('Ismeretlen művelet.'));
}
function human(n) { return n > 1073741824 ? (n/1073741824).toFixed(2)+' GB' : n > 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(n/1024))+' KB'; }
function splitName(n) { var i = n.lastIndexOf('.'); return i > 0 ? [n.slice(0, i), n.slice(i + 1)] : [n, '']; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function refresh() { $('go').disabled = busy || !folder || !items.length; }

call('getFolders').then(function (fs) {
  $('folders').innerHTML = fs.map(function (f) { return '<button type="button" data-k="'+esc(f.key)+'">'+esc(f.label)+'</button>'; }).join('');
  var bs = document.querySelectorAll('#folders button');
  Array.prototype.forEach.call(bs, function (b) {
    b.onclick = function () {
      if (busy) return;
      Array.prototype.forEach.call(bs, function (x) { x.classList.remove('on'); });
      b.classList.add('on'); folder = b.dataset.k; refresh();
    };
  });
  if (bs.length === 1) bs[0].click();
}).catch(function (e) { $('folders').innerHTML = '<span class="err">Hiba: ' + esc(e.message) + '</span>'; });

$('files').onchange = function () {
  if (busy) return;
  items = Array.prototype.map.call(this.files, function (f) { var s = splitName(f.name); return { file: f, base: s[0], ext: s[1] }; });
  $('list').innerHTML = items.map(function (it, i) {
    return '<div class="file" id="f'+i+'"><div class="meta">'+esc(it.file.name)+' · '+human(it.file.size)+'</div>' +
      '<div class="nm"><input type="text" data-i="'+i+'" value="'+esc(it.base)+'" aria-label="Fájl neve">' +
      (it.ext ? '<span>.'+esc(it.ext)+'</span>' : '') + '</div><div class="bar"><i></i></div><div class="st"></div></div>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#list input'), function (inp) {
    inp.oninput = function () { items[this.dataset.i].base = this.value; };
  });
  $('msg').textContent = ''; refresh();
};

function readB64(blob) {
  return new Promise(function (ok, bad) {
    var fr = new FileReader();
    fr.onload = function () { ok(String(fr.result).split(',')[1] || ''); };
    fr.onerror = function () { bad(new Error('A fájl nem olvasható.')); };
    fr.readAsDataURL(blob);
  });
}

async function uploadOne(it, i) {
  var row = $('f'+i), bar = row.querySelector('.bar i'), st = row.querySelector('.st');
  var f = it.file, type = f.type || (/\.(mov|mp4|m4v|3gp|webm)$/i.test(f.name) ? 'video/mp4' : 'image/jpeg');
  st.className = 'st'; st.textContent = 'Indul…';
  var s = await call('initUpload', folder, it.base, it.ext, type, f.size, '');
  for (var start = 0; start < f.size; start += CHUNK) {
    var b64 = await readB64(f.slice(start, Math.min(start + CHUNK, f.size)));
    var tries = 0;
    while (true) {
      try { await call('uploadChunk', s.session, b64, start, f.size); break; }
      catch (e) { if (++tries >= 3) throw e; await new Promise(function (w) { setTimeout(w, 2000 * tries); }); }
    }
    var pct = Math.round(Math.min(start + CHUNK, f.size) / f.size * 100);
    bar.style.width = pct + '%'; st.textContent = pct + '%';
  }
  bar.style.width = '100%'; st.className = 'st ok'; st.textContent = '✓ Kész';
}

$('go').onclick = async function () {
  if (busy || !items.length || !folder) return;
  busy = true; refresh(); $('files').disabled = true;
  $('msg').className = ''; $('msg').textContent = 'Feltöltés… ne zárd be az oldalt.';
  var ok = 0, bad = 0;
  for (var i = 0; i < items.length; i++) {
    try { await uploadOne(items[i], i); ok++; }
    catch (e) { bad++; var st = $('f'+i).querySelector('.st'); st.className = 'st err'; st.textContent = 'Hiba: ' + e.message; }
  }
  busy = false; $('files').disabled = false; $('files').value = ''; items = []; refresh();
  $('msg').className = bad ? 'err' : 'ok';
  $('msg').textContent = bad ? ok + ' kész, ' + bad + ' sikertelen – válaszd ki újra a hibásat.' : '✓ ' + ok + ' fájl feltöltve. Köszönjük!';
};
</script>
</body>
</html>
