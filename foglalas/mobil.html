<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MOSAIC – fotó és videó feltöltés</title>
<link rel="icon" href="/assets/img/c2eb0f_b001e2c55098446da3e38ff055e20354.png" type="image/png">
<link rel="stylesheet" href="/assets/css/wix-google-fonts.css">
<!-- Belso oldal: a kollegak telefonrol toltenek fel fotot/videot a Mosaic Drive-jaba
     (mosaicheadspa Apps Script JSON API, a fajl a Mosaic tarhelyet hasznalja). Nincs mero kod, nincs link ra, noindex. -->
<style>
  :root { --sotet:#183033; --kozep:#44595c; --halvany:#6d8285; --krem:#fbeede; --hatter:#fffaf4; --vonal:#e6dccd; --feher:#fff; --ok:#2f6b4f; --hiba:#a33a2b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--hatter); color:var(--sotet); font:15px/1.4 'lato','Helvetica Neue',Arial,sans-serif; }
  main { max-width:480px; margin:0 auto; padding:12px 14px 20px; }
  .fej { background:var(--sotet); border-radius:12px; padding:10px; margin:0 0 10px; }
  .logo { display:block; margin:0 auto; height:36px; width:auto; }
  h1 { font-size:18px; margin:0 0 10px; letter-spacing:.3px; text-align:center; }
  label.c { display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--kozep); margin:10px 0 5px; }
  select, input[type=text], .mappak button { font-family:inherit; }
  select, input[type=text] { width:100%; font-size:16px; padding:10px 11px; border:1px solid var(--vonal); border-radius:10px; background:var(--feher); color:var(--sotet); }
  .mappak { display:flex; flex-wrap:wrap; gap:6px; }
  .mappak button { flex:1 1 auto; padding:8px 10px; font-size:14px; font-weight:700; border-radius:999px; border:1px solid var(--vonal); background:var(--feher); color:var(--sotet); }
  .mappak button.on { background:var(--sotet); border-color:var(--sotet); color:var(--krem); }
  .gombok { display:flex; gap:8px; margin-top:14px; }
  .gomb { flex:1; display:flex; align-items:center; justify-content:center; min-height:46px; padding:10px; border-radius:12px; font-size:16px; font-weight:700; border:0; cursor:pointer; text-align:center; font-family:inherit; }
  .valaszt { background:var(--krem); color:var(--sotet); border:1px solid var(--vonal); }
  .valaszt input { display:none; }
  #go { background:var(--sotet); color:var(--krem); }
  #go:disabled { opacity:.35; }
  #list { margin-top:10px; }
  .file { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--vonal); font-size:13px; }
  .file .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--kozep); }
  .file .bar { width:70px; height:6px; background:var(--vonal); border-radius:3px; overflow:hidden; }
  .file .bar i { display:block; height:100%; width:0; background:var(--sotet); transition:width .2s; }
  .file .st { width:52px; text-align:right; font-weight:700; }
  .ok { color:var(--ok); } .err { color:var(--hiba); }
  #msg { font-size:14px; font-weight:700; text-align:center; margin-top:10px; min-height:20px; }
</style>
</head>
<body>
<main>
  <div class="fej"><img class="logo" src="/assets/img/logo-102x30@1x.png" srcset="/assets/img/logo-102x30@1x.png 1x, /assets/img/logo-102x30@2x.png 2x, /assets/img/logo-102x30@3x.png 3x" alt="MOSAIC" width="122" height="36"></div>
  <h1>Fotó és videó feltöltés</h1>

  <label class="c" for="who">Ki vagy?</label>
  <select id="who"><option value="">Válassz…</option></select>

  <label class="c">Melyik mappába?</label>
  <div class="mappak" id="folders">Betöltés…</div>

  <label class="c" for="mi">Mi van a képen? (ez lesz a fájl neve)</label>
  <input id="mi" type="text" maxlength="60" placeholder="pl. balayage előtte-utána" autocomplete="off">

  <div class="gombok">
    <label class="gomb valaszt">+ Fotó / videó<input id="files" type="file" accept="image/*,video/*" multiple></label>
    <button class="gomb" id="go" disabled>Feltöltés</button>
  </div>
  <div id="list"></div>
  <div id="msg"></div>
</main>

<script>
var API = 'https://script.google.com/macros/s/AKfycbyrKy330YbhzafbMPR1PL260lYvqBQZ7Q2Uzx3-z0tZdUAYqAepDY8tjfxFFYxNaywArQ/exec';
// Munkatarsak uzletagonkent; a nev kivalasztasa elore kijeloli az uzletag mappajat (atallithato).
var CSAPAT = [
  { mappa: 'HEA', cim: 'Head spa', nevek: ['Janka', 'Jucus', 'Mészáros Dóri', 'Zolcer Viki', 'Czakó Wiki', 'Fanni', 'Vercsek Vivien', 'Judit', 'Niki', 'Zsuzsi'] },
  { mappa: 'FOD', cim: 'Fodrászat', nevek: ['Betti', 'Evelin', 'Noel'] },
  { mappa: 'OXI', cim: 'Oxigénterápia', nevek: ['Tündi', 'Menyhárt Móni', 'Szűcs Vivien'] },
  { mappa: 'LEZ', cim: 'Szőrtelenítés', nevek: ['Zsófi'] },
  { mappa: 'PMU', cim: 'Sminktetoválás', nevek: ['Melitta'] },
  { mappa: '', cim: 'Egyéb', nevek: ['Recepció', 'Evelin', 'Feri', 'Dani', 'Hermina'] }
];
var CHUNK = 8 * 1024 * 1024; // 8 MB, a 256 KB tobbszorose
var folder = '', items = [], busy = false;
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

async function api(body) {
  var r = await fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('Kapcsolati hiba (' + r.status + ').');
  var j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Ismeretlen hiba.');
  return j.data;
}
function kesz() { return !busy && folder && $('who').value && $('mi').value.trim() && items.length; }
function refresh() { $('go').disabled = !kesz(); }
function valasztMappa(k) {
  folder = k;
  Array.prototype.forEach.call(document.querySelectorAll('#folders button'), function (b) { b.classList.toggle('on', b.dataset.k === k); });
  refresh();
}

$('who').innerHTML += CSAPAT.map(function (g) {
  return '<optgroup label="' + esc(g.cim) + '">' + g.nevek.map(function (n) { return '<option data-m="' + g.mappa + '">' + esc(n) + '</option>'; }).join('') + '</optgroup>';
}).join('');
$('who').onchange = function () { var o = this.selectedOptions[0]; if (o && o.dataset.m) valasztMappa(o.dataset.m); refresh(); };
$('mi').oninput = refresh;

api({ a: 'folders' }).then(function (fs) {
  $('folders').innerHTML = fs.map(function (f) { return '<button type="button" data-k="' + esc(f.key) + '">' + esc(f.label) + '</button>'; }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#folders button'), function (b) { b.onclick = function () { if (!busy) valasztMappa(b.dataset.k); }; });
  var o = $('who').selectedOptions[0]; if (o && o.dataset.m) valasztMappa(o.dataset.m);
}).catch(function (e) { $('folders').innerHTML = '<span class="err">Hiba: ' + esc(e.message) + '</span>'; });

function human(n) { return n > 1073741824 ? (n/1073741824).toFixed(1)+' GB' : n > 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(n/1024))+' KB'; }
function kiterjesztes(n) { var i = n.lastIndexOf('.'); return i > 0 ? n.slice(i + 1) : ''; }

$('files').onchange = function () {
  if (busy) return;
  items = Array.prototype.slice.call(this.files);
  $('list').innerHTML = items.map(function (f, i) {
    return '<div class="file" id="f' + i + '"><span class="n">' + esc(f.name) + ' · ' + human(f.size) + '</span><span class="bar"><i></i></span><span class="st"></span></div>';
  }).join('');
  $('msg').textContent = ''; refresh();
};

function readB64(blob) {
  return new Promise(function (ok, bad) {
    var fr = new FileReader();
    fr.onload = function () { ok(String(fr.result).split(',')[1] || ''); };
    fr.onerror = function () { bad(new Error('A fájl nem olvasható.')); };
    fr.readAsDataURL(blob);
  });
}

async function uploadOne(f, i, nev) {
  var row = $('f' + i), bar = row.querySelector('.bar i'), st = row.querySelector('.st');
  var type = f.type || (/\.(mov|mp4|m4v|3gp|webm)$/i.test(f.name) ? 'video/mp4' : 'image/jpeg');
  st.className = 'st'; st.textContent = '…';
  var s = await api({ a: 'init', folder: folder, name: nev, ext: kiterjesztes(f.name), type: type, size: f.size, who: $('who').value });
  for (var start = 0; start < f.size; start += CHUNK) {
    var b64 = await readB64(f.slice(start, Math.min(start + CHUNK, f.size)));
    for (var tries = 0; ; ) {
      try { await api({ a: 'chunk', session: s.session, b64: b64, start: start, total: f.size }); break; }
      catch (e) { if (++tries >= 3) throw e; await new Promise(function (w) { setTimeout(w, 2000 * tries); }); }
    }
    var pct = Math.round(Math.min(start + CHUNK, f.size) / f.size * 100);
    bar.style.width = pct + '%'; st.textContent = pct + '%';
  }
  st.className = 'st ok'; st.textContent = '✓';
}

$('go').onclick = async function () {
  if (!kesz()) return;
  busy = true; refresh(); $('files').disabled = true;
  $('msg').className = ''; $('msg').textContent = 'Feltöltés… ne zárd be az oldalt.';
  var alap = $('mi').value.trim(), ok = 0, bad = 0, hiba = '';
  for (var i = 0; i < items.length; i++) {
    var nev = items.length > 1 ? alap + ' ' + (i + 1) : alap;
    try { await uploadOne(items[i], i, nev); ok++; }
    catch (e) { bad++; hiba = e.message; var st = $('f' + i).querySelector('.st'); st.className = 'st err'; st.textContent = 'hiba'; }
  }
  busy = false; $('files').disabled = false; $('files').value = ''; items = [];
  $('msg').className = bad ? 'err' : 'ok';
  $('msg').textContent = bad ? ok + ' kész, ' + bad + ' sikertelen: ' + hiba : '✓ ' + ok + ' fájl feltöltve. Köszönjük!';
  if (!bad) $('mi').value = '';
  refresh();
};
</script>
</body>
</html>
